name: MacroPulseNative
options:
  bundleIdPrefix: com.joewalker989.macropulse
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 9.0
targets:
  MacroPulse:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: MacroPulse
        UILaunchScreen: {}
        WKAppBoundDomains: [joewalker989.github.io]
        NSHealthShareUsageDescription: Read the health records you choose for your private MacroPulse progress log.
        NSFaceIDUsageDescription: Unlock your private MacroPulse screen.
        NSSupportsLiveActivities: true
    entitlements:
      path: Generated/Phone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.joewalker989.macropulse]
    dependencies:
      - target: MacroPulseWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.macropulse
        TARGETED_DEVICE_FAMILY: '1,2'
  MacroPulseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: MacroPulse widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.joewalker989.macropulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.macropulse.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
  MacroPulseWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: MacroPulse
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.joewalker989.macropulse
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: Show heart rate and energy during your chosen workout.
        NSHealthUpdateUsageDescription: Save a workout only after you explicitly start and finish it.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joewalker989.macropulse.watch
schemes:
  MacroPulse:
    build:
      targets:
        MacroPulse: all
  MacroPulseWatch:
    build:
      targets:
        MacroPulseWatch: all
