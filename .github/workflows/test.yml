name: PWA checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check food-search.js && node --check food-search-ui.js && node --check setup.js && node --check setup-ui.js && node --check daily-home.js && node --check recipe-nutrition.js && node --check recipe-nutrition-ui.js && node --check sync.js && node --check sync-ui.js && node --check video-catalog.js && node --check video-library.js && node --check barcode-reader.js && node --check native-bridge.js && node --check plus.js && node --check plus-ui.js && node --check cloud.js && node --check ocr-assets.js && node --check ocr-loader.js && node --check label-reader.js && node --check connected.js && node --check connected-ui.js && node --check privacy-lock.js && node --check extras.js && node --check extras-ui.js && node --check restaurant-guide.js && node --check workout-visuals.js && node --check stack-guide.js && node --check seven.js && node --check seven-ui.js && node --check photo-compare.js && node --check six.js && node --check six-ui.js && node --check health.js && node --check health-ui.js && node --check five.js && node --check five-ui.js && node --check photos.js && node --check photos-ui.js && node --check complete.js && node --check complete-ui.js && node --check app.js && node --check data.js && node --check upgrade.js && node --check upgrade-ui.js && node --check training.js && node --check training-ui.js && node --check sw.js
      - run: npm test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify deployed core on GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run test:core
        env:
          MACROPULSE_URL: https://joewalker989.github.io/MacroPulse/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/

