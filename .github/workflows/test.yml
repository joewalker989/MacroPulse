name: PWA checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check complete.js && node --check complete-ui.js && node --check app.js && node --check data.js && node --check upgrade.js && node --check upgrade-ui.js && node --check training.js && node --check training-ui.js && node --check sw.js
      - run: npm test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify deployed core on GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run test:core
        env:
          MACROPULSE_URL: https://joewalker989.github.io/MacroPulse/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/

